[project]
name = "logistello-tools"
version = "0.1.0"
description = "Logistello reproduction: data extraction, evaluation/GLEM training, and visualization tools"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15",
    "runvault[read]",
]

[project.scripts]
logistello-tools = "logistello_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logistello_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]


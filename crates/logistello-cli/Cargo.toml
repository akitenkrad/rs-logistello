[package]
name = "logistello-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Logistello reproduction: unified command-line interface."

[lib]
name = "logistello_cli"
path = "src/lib.rs"

[[bin]]
name = "logistello"
path = "src/main.rs"

# Workspace-level integration tests (live at the repo root `tests/`).
[[test]]
name = "perft_test"
path = "../../tests/perft_test.rs"

[[test]]
name = "search_test"
path = "../../tests/search_test.rs"

[[test]]
name = "probcut_test"
path = "../../tests/probcut_test.rs"

[[test]]
name = "multi_probcut_test"
path = "../../tests/multi_probcut_test.rs"

[[test]]
name = "endgame_test"
path = "../../tests/endgame_test.rs"

[[test]]
name = "engine_play_test"
path = "../../tests/engine_play_test.rs"

[[test]]
name = "pattern_test"
path = "../../tests/pattern_test.rs"

[[test]]
name = "extract_test"
path = "../../tests/extract_test.rs"

[[test]]
name = "eval_interop_test"
path = "../../tests/eval_interop_test.rs"

[[test]]
name = "glem_interop_test"
path = "../../tests/glem_interop_test.rs"

[[test]]
name = "book_test"
path = "../../tests/book_test.rs"

[[test]]
name = "edax_smoke_test"
path = "../../tests/edax_smoke_test.rs"

[[test]]
name = "murakami_replay_test"
path = "../../tests/murakami_replay_test.rs"

[[test]]
name = "sweep_test"
path = "../../tests/sweep_test.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
logistello-core.workspace = true
logistello-eval.workspace = true
logistello-search.workspace = true
logistello-book.workspace = true
othello-core.workspace = true
othello-io.workspace = true
othello-player.workspace = true
othello-engine.workspace = true

# runvault — 実験記録基盤．run ディレクトリ・config.json・metrics.csv・
# events.jsonl・manifest を持つ．出力の置き場と同一性はこちらに預けるので，
# 自前のタイムスタンプ付きディレクトリと `results/latest` はもう作らない．
# git 依存．具体的な commit は Cargo.lock で固定される．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }

[dev-dependencies]
logistello-core.workspace = true
logistello-eval.workspace = true
logistello-search.workspace = true
logistello-book.workspace = true
othello-core.workspace = true
othello-engine.workspace = true
othello-player.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true
anyhow.workspace = true
